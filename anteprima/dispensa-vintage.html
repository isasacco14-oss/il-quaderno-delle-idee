
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La mia dispensa · Il Quaderno delle Idee</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&display=swap');
:root{--ink:#604735;--paper:#f4e8ce;--edge:#cbb28c}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;font-style:italic;background:radial-gradient(ellipse at 20% 10%,#faf2df,#ddc9a6 85%);min-height:100vh}
main{max-width:850px;margin:25px auto;padding:35px 28px;background:linear-gradient(110deg,#e9d7b6 0%,#faf0db 8%,#f5e7cb 93%,#dfc7a2 100%);border:1px solid #bda27c;border-radius:8px;box-shadow:0 10px 35px #6c4b2d33}
h1{font:normal 58px 'Great Vibes',cursive;text-align:center;margin:10px 0}
h2{font-size:30px;font-weight:600;margin:22px 0 12px}
.subtitle,.decoration{text-align:center}
.subtitle{margin:0 0 15px}
.decoration{font-size:25px;color:#8d7455;letter-spacing:7px}
a{color:var(--ink)}
.back{display:inline-block;text-decoration:none;border-bottom:1px dotted #9a8061}
label{display:block;margin:10px 0 5px}
input,select,button{font:italic 20px 'Cormorant Garamond',Georgia,serif;color:var(--ink)}
input,select{background:#fff9e9;border:0;border-bottom:1px solid #a98d6c;padding:9px;width:100%;border-radius:3px}
button{background:transparent;border:0;border-bottom:1px solid #ab9273;padding:7px 10px;cursor:pointer}
button:hover,.back:hover{background:#e7d6b64d}
form{border-top:1px solid #cbb28c;border-bottom:1px solid #cbb28c;padding:14px 0 20px}
.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:15px}
.search{margin:16px 0}
.item{padding:13px 4px;border-bottom:1px dotted #bba17e;display:flex;justify-content:space-between;align-items:center;gap:12px}
.item strong{font-size:25px;font-weight:600}
.item small{display:block;font-size:17px}
.item .buttons{display:flex;gap:7px;flex-wrap:wrap}
.item button{font-size:17px}
.empty{text-align:center;padding:30px 5px}
.warning{color:#985037}
.note{font-size:17px}
#status{min-height:25px}
@media(max-width:600px){main{margin:8px;padding:20px 14px}h1{font-size:46px}.fields{grid-template-columns:1fr 1fr}.fields>div:first-child{grid-column:1/-1}.item{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
<a class="back" href="./quaderno-vintage-sfumatura-delicata-collegato.html" onclick="sessionStorage.setItem('tornaAlLibro','si')">← Torna al Quaderno delle Idee</a>
<div class="decoration">❧ ✿ ❧</div>
<h1>La mia dispensa</h1>
<p class="subtitle">Le piccole cose che custodisco in cucina...</p>
<form id="form">
<div class="fields">
<div><label for="name">Ingrediente</label><input id="name" placeholder="Es. farina 00" maxlength="100" required></div>
<div><label for="quantity">Quantità</label><input id="quantity" type="number" min="0" step="any" placeholder="Es. 500" required></div>
<div><label for="unit">Unità</label><select id="unit"><option>g</option><option>kg</option><option>ml</option><option>l</option><option>pezzi</option><option>confezioni</option><option>vasetti</option></select></div>
</div>
<label for="expiry">Scadenza (facoltativa)</label>
<input id="expiry" type="date">
<div class="actions">
<button id="submit" type="submit">✿ Aggiungi alla dispensa</button>
<button id="cancel" type="button" hidden>Annulla modifica</button>
</div>
</form>
<h2>I miei ingredienti</h2>
<input id="search" class="search" placeholder="Cerca nella dispensa..." aria-label="Cerca ingrediente">
<div id="list"></div>
<p id="status" class="note" role="status"></p>
<p class="note">Gli ingredienti vengono salvati su questo dispositivo. Le date sono promemoria personali, non una verifica della sicurezza alimentare.</p>
<div class="decoration">❧ ✿ ❧</div>
</main>
<script>
'use strict';
const KEY='quadernoIdeeDispensa_v1';
const $=id=>document.getElementById(id);
function read(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:[]}catch{return []}}
let items=read(),editing=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));$('status').textContent='✓ Dispensa salvata su questo dispositivo';return true}catch{$('status').textContent='Impossibile salvare: controlla lo spazio disponibile';return false}}
function el(tag,text){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x}
function resetForm(){$('form').reset();editing=null;$('submit').textContent='✿ Aggiungi alla dispensa';$('cancel').hidden=true}
function dateLabel(value){if(!value)return '';const d=new Date(value+'T12:00:00');return Number.isNaN(d.getTime())?'':d.toLocaleDateString('it-IT')}
function render(){const list=$('list');list.replaceChildren();const query=$('search').value.trim().toLocaleLowerCase('it-IT');const filtered=items.filter(x=>String(x.name||'').toLocaleLowerCase('it-IT').includes(query)).sort((a,b)=>String(a.name).localeCompare(String(b.name),'it'));if(!filtered.length){list.append(el('p',items.length?'Nessun ingrediente trovato.':'La dispensa è ancora vuota. Aggiungi il primo ingrediente!'));return}for(const item of filtered){const row=el('div');row.className='item';const info=el('div'),name=el('strong',item.name),qty=el('div',item.quantity+' '+item.unit);info.append(name,qty);if(item.expiry){const exp=el('small','Scadenza: '+dateLabel(item.expiry));const today=new Date();today.setHours(0,0,0,0);const deadline=new Date(item.expiry+'T00:00:00');if(deadline<today){exp.className='warning';exp.textContent+=' · Data superata'}info.append(exp)}const buttons=el('div');buttons.className='buttons';const edit=el('button','Modifica'),remove=el('button','Elimina');edit.type=remove.type='button';edit.onclick=()=>{editing=item.id;$('name').value=item.name;$('quantity').value=item.quantity;$('unit').value=item.unit;$('expiry').value=item.expiry||'';$('submit').textContent='✿ Salva modifiche';$('cancel').hidden=false;$('name').focus();window.scrollTo({top:0,behavior:'smooth'})};remove.onclick=()=>{if(!confirm('Eliminare '+item.name+' dalla dispensa?'))return;const previous=items;items=items.filter(x=>x.id!==item.id);if(!save())items=previous;if(editing===item.id)resetForm();render()};buttons.append(edit,remove);row.append(info,buttons);list.append(row)}}
$('form').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim(),quantity=Number($('quantity').value),unit=$('unit').value,expiry=$('expiry').value;if(!name||!Number.isFinite(quantity)||quantity<0)return;const previous=items.slice();if(editing){const index=items.findIndex(x=>x.id===editing);if(index<0)return;items[index]={...items[index],name,quantity,unit,expiry}}else{items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+'_'+Math.random(),name,quantity,unit,expiry})}if(save()){resetForm()}else{items=previous}render()});
$('cancel').onclick=resetForm;
$('search').addEventListener('input',render);
render();
</script>
</body>
</html>
